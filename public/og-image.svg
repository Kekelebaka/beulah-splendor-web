<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&amp;family=Manrope:wght@300;400;500&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="#F7F1E9"/>
  <!-- Aubergine accent bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#341335"/>
  <!-- Butterfly mark (simplified) -->
  <g transform="translate(600, 220) scale(2.5)" opacity="0.15">
    <path d="M0-30C-15-30-25-20-25-10S-15 10 0 15C15 10 25 0 25-10S15-30 0-30Z" fill="#341335"/>
    <path d="M0-30C-8-25-12-15-10-5L0 15Z" fill="#55204F"/>
    <path d="M0-30C8-25 12-15 10-5L0 15Z" fill="#6A2C70"/>
  </g>
  <!-- Brand name -->
  <text x="600" y="300" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-weight="600" font-size="72" fill="#341335" letter-spacing="8">
    BEULAH
  </text>
  <text x="600" y="340" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="500" font-size="18" fill="#A8779D" letter-spacing="12">
    SPLENDOR
  </text>
  <!-- Tagline -->
  <text x="600" y="410" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="300" font-size="22" fill="#55204F">
    Wellness &amp; Beauty
  </text>
  <!-- Signature -->
  <text x="600" y="480" text-anchor="middle" font-family="'Caveat', cursive" font-weight="400" font-size="24" fill="#C9A96B">
    Extracting Beauty from Nature
  </text>
  <!-- Bottom accent -->
  <rect x="500" y="560" width="200" height="2" fill="#C9A96B" rx="1"/>
  <!-- Pretoria -->
  <text x="600" y="600" text-anchor="middle" font-family="'Manrope', sans-serif" font-weight="400" font-size="14" fill="#A8779D">
    Pretoria, South Africa
  </text>
</svg>
