# Beulah Splendor — Staging CI/CD Pipeline
# Pushes to beulah-web-v1 → vinext build → Cloudflare Workers staging
# Does NOT deploy production.

name: Beulah Staging

on:
  push:
    branches: [beulah-web-v1]
  workflow_dispatch:

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  build-and-deploy:
    name: Build + Deploy Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: vinext compatibility check
        run: npx vinext check

      # vinext-cloudflare deploy handles its own build.
      # No separate vinext build step needed.

      - name: Ensure D1 staging database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Using wrangler for D1 operations"
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 list 2>&1 | head -20

          # Create database if it doesn't exist
          if ! npx wrangler d1 list 2>&1 | grep -q "beulah-splendor-staging"; then
            echo "Creating D1 database: beulah-splendor-staging"
            npx wrangler d1 create beulah-splendor-staging 2>&1
          else
            echo "D1 database beulah-splendor-staging already exists"
          fi

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Applying migrations to beulah-splendor-staging"
          npx wrangler d1 execute beulah-splendor-staging \
            --remote \
            --file=./src/lib/db/migrations/0001_init.sql 2>&1
          echo "Migrations applied"

      - name: Seed staging D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Seeding staging data"
          npx wrangler d1 execute beulah-splendor-staging \
            --remote \
            --file=./src/lib/db/seed.sql 2>&1
          echo "Seed applied"

      - name: Deploy staging Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying with vinext-cloudflare..."
          npx vinext-cloudflare deploy 2>&1 | tee deploy-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Deploy exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Deploy failed"
            exit 1
          fi
          echo "Staging deployed"

          # Extract URL from deploy output or construct it
          DEPLOY_URL=$(grep -oP 'https://[^\s]+\.workers\.dev' deploy-output.txt 2>/dev/null || echo "")

          if [ -z "$DEPLOY_URL" ]; then
            SUBDOMAIN=$(curl -s \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              | jq -r '.result.subdomain' 2>/dev/null)

            if [ -n "$SUBDOMAIN" ] && [ "$SUBDOMAIN" != "null" ]; then
              DEPLOY_URL="https://beulah-splendor-web.${SUBDOMAIN}.workers.dev"
            fi
          fi

          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT
          echo ""
          echo "STAGING URL: $DEPLOY_URL"
          echo "SHA: ${{ github.sha }}"
          echo "TIME: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Smoke test staging
        if: steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Smoke testing: $URL"
          PASS=0
          FAIL=0

          for route in "/" "/treatments" "/wellness" "/wellness/health-scan" "/about" "/beulah-talks" "/book" "/contact" "/privacy" "/terms" "/booking-policy" "/treatments/massage" "/robots.txt" "/sitemap.xml"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL$route" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "  OK $route -> $STATUS"
              PASS=$((PASS + 1))
            else
              echo "  FAIL $route -> $STATUS"
              FAIL=$((FAIL + 1))
            fi
          done

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL/this-page-does-not-exist" 2>/dev/null || echo "000")
          if [ "$STATUS" = "404" ]; then
            echo "  OK /unknown -> 404"
            PASS=$((PASS + 1))
          else
            echo "  FAIL /unknown -> $STATUS (expected 404)"
            FAIL=$((FAIL + 1))
          fi

          echo "Smoke test: $PASS passed, $FAIL failed"

      - name: Test booking API
        if: steps.deploy.outputs.url != ''
        run: |
          URL="${{ steps.deploy.outputs.url }}"

          echo "Testing POST /api/bookings with valid payload"
          RESULT=$(curl -s -X POST "$URL/api/bookings" \
            -H "Content-Type: application/json" \
            -d '{
              "treatmentId": "massage",
              "preferredDate": "2026-09-20",
              "preferredTime": "10:00",
              "customerName": "RC3 TEST USER",
              "customerPhone": "+27821234567",
              "customerEmail": "test@example.com",
              "notes": "RC-3 staging test"
            }')
          echo "Response: $RESULT"

          OK=$(echo "$RESULT" | jq -r '.ok' 2>/dev/null)
          REF=$(echo "$RESULT" | jq -r '.reference' 2>/dev/null)

          if [ "$OK" = "true" ] && [ -n "$REF" ] && [ "$REF" != "null" ]; then
            echo "Booking API returned reference: $REF"
          else
            echo "Booking API failed or returned unexpected response"
          fi

          echo ""
          echo "Testing invalid payload -> expect 400"
          BAD_RESULT=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/api/bookings" \
            -H "Content-Type: application/json" \
            -d '{"invalid": true}')
          echo "Status: $BAD_RESULT"

          if [ "$BAD_RESULT" = "400" ]; then
            echo "Invalid payload correctly rejected"
          else
            echo "Expected 400, got $BAD_RESULT"
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo ""
          echo "BEULAH SPLENDOR STAGING SUMMARY"
          echo "Branch: beulah-web-v1"
          echo "Commit: ${{ github.sha }}"
          echo "URL: ${{ steps.deploy.outputs.url }}"
          echo "D1: beulah-splendor-staging"
          echo "Turnstile: NOT_CONFIGURED"
          echo "WhatsApp: UNCONFIGURED"
